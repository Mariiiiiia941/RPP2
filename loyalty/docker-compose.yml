x-db-url: &db-url postgresql+asyncpg://${POSTGRES_USER:-loyalty}:${POSTGRES_PASSWORD:-loyalty_pass}@postgres:5432/${POSTGRES_DB:-loyalty}
x-mq-url: &mq-url amqp://${RABBITMQ_DEFAULT_USER:-loyalty}:${RABBITMQ_DEFAULT_PASS:-loyalty_pass}@rabbitmq:5672/

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loyalty_pass}
      POSTGRES_DB: ${POSTGRES_DB:-loyalty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq          # имя узла фиксировано, иначе данные тома «теряются» при пересоздании
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-loyalty}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-loyalty_pass}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      RABBITMQ_URL: *mq-url
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:                # готов, когда созданы таблицы и объявлены обменники/очереди
      test: ["CMD", "test", "-f", "/tmp/worker_ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      RABBITMQ_URL: *mq-url
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_healthy

  notifier:
    build: ./notifier
    restart: unless-stopped
    environment:
      RABBITMQ_URL: *mq-url
      MIN_DELAY_MS: ${MIN_DELAY_MS:-200}
      MAX_DELAY_MS: ${MAX_DELAY_MS:-1500}
      UNSUBSCRIBED: ${UNSUBSCRIBED:-}
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy

  analytics:
    build: ./analytics
    restart: unless-stopped
    environment:
      RABBITMQ_URL: *mq-url
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq_data:
